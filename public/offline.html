<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | Refetch</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --surface: #ffffff;
        --label: #1d1d1f;
        --secondary: #6e6e73;
        --brand: #4e1cb3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0d13;
          --surface: #1a1922;
          --label: #f5f5f7;
          --secondary: #a1a1aa;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--label);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 360px;
        padding: 32px 28px;
        border-radius: 22px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: var(--secondary);
        font-size: 15px;
        line-height: 1.45;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Refetch needs a connection to load the latest stories. Check your network and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
